<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة زايد — النسخة الجديدة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,sans-serif}
body{background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;color:#fff;padding:20px}
.sd-card{background:#1e293b;border-radius:15px;padding:15px;border:2px solid #fbbf24;text-align:center}
.sd-card .num{font-size:28px;font-weight:900;color:#fbbf24}
.sd-card .lbl{font-size:12px;color:#94a3b8;margin-top:5px}
.sd-user{background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:8px;border-right:4px solid #3b82f6;color:#0f172a;font-size:13px}
.sd-btn{padding:8px 16px;border-radius:20px;border:none;font-family:Cairo;font-weight:900;font-size:12px;cursor:pointer;color:white;margin:2px}
</style>
</head>
<body>

<!-- 📊 زر الإحصائيات (للمشرف) -->
<button id="statsBtn" onclick="document.getElementById('dash').style.display='block';sdLoad()" style="display:none;position:fixed;bottom:20px;right:20px;z-index:9999;padding:14px 22px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:white;border:3px solid #fbbf24;border-radius:50px;font-weight:900;cursor:pointer">📊 الإحصائيات</button>

<!-- 📊 لوحة الإحصائيات -->
<div id="dash" style="display:none;position:fixed;inset:0;z-index:99999;background:#0f172a;overflow-y:auto;padding:20px">
  <div style="max-width:1100px;margin:0 auto">
    <div style="text-align:center;margin-bottom:20px">
      <h1 style="color:#fbbf24;font-size:22px">📊 الإحصائيات</h1>
      <button onclick="document.getElementById('dash').style.display='none'" class="sd-btn" style="background:#dc2626;margin-top:10px">✖ إغلاق</button>
    </div>
    <div id="cards" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">
      <div class="sd-card"><div class="num" id="nU">-</div><div class="lbl">👥 مسجل</div></div>
      <div class="sd-card"><div class="num" id="nV">-</div><div class="lbl">🎭 زائر</div></div>
      <div class="sd-card"><div class="num" id="nS">-</div><div class="lbl">💎 مشترك</div></div>
      <div class="sd-card"><div class="num" id="nT">-</div><div class="lbl">✨ اليوم</div></div>
    </div>
    <input id="q" placeholder="🔍 ابحث..." oninput="renderUsers()" style="width:100%;padding:12px;border-radius:20px;border:2px solid #475569;background:#1e293b;color:white;margin-bottom:15px;font-size:14px">
    <button onclick="exportUsers()" class="sd-btn" style="background:#16a34a">📥 Excel المسجلين</button>
    <button onclick="exportVisitors()" class="sd-btn" style="background:#1e40af">📥 Excel الزوار</button>
    <div id="list" style="margin-top:20px"></div>
  </div>
</div>

<!-- 🚪 بوابة الزائر (7 حقول) -->
<div id="gate" style="position:fixed;inset:0;z-index:999999;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;align-items:center;justify-content:center;padding:15px;overflow-y:auto;display:none">
  <div style="background:#1e293b;border:4px solid #fbbf24;border-radius:25px;padding:25px 20px;max-width:500px;width:100%;margin:auto">
    <div style="text-align:center;font-size:45px">👋</div>
    <h2 style="color:#fbbf24;text-align:center;font-size:18px;margin:8px 0">أهلاً بك في منصة زايد</h2>
    <p style="color:#cbd5e1;text-align:center;font-size:12px;margin-bottom:15px">سجّل بياناتك للتصفح مجاناً</p>
    <div id="err" style="display:none;color:#fca5a5;background:rgba(220,38,38,0.2);padding:8px;border-radius:12px;font-size:12px;margin-bottom:10px;text-align:center"></div>
    <input id="fName" placeholder="👤 الاسم الكامل *" style="width:100%;padding:11px;margin-bottom:8px;border:2px solid #475569;border-radius:20px;background:#0f172a;color:white;font-size:13px;box-sizing:border-box">
    <input id="fProf" placeholder="💼 المهنة *" style="width:100%;padding:11px;margin-bottom:8px;border:2px solid #475569;border-radius:20px;background:#0f172a;color:white;font-size:13px;box-sizing:border-box">
    <input id="fSpec" placeholder="🎯 الاختصاص *" style="width:100%;padding:11px;margin-bottom:8px;border:2px solid #475569;border-radius:20px;background:#0f172a;color:white;font-size:13px;box-sizing:border-box">
    <input id="fEmail" type="email" placeholder="📧 البريد الإلكتروني *" style="width:100%;padding:11px;margin-bottom:8px;border:2px solid #475569;border-radius:20px;background:#0f172a;color:white;font-size:13px;box-sizing:border-box">
    <input id="fPhone" type="tel" placeholder="📱 رقم الواتساب *" style="width:100%;padding:11px;margin-bottom:8px;border:2px solid #475569;border-radius:20px;background:#0f172a;color:white;font-size:13px;box-sizing:border-box">
    <input id="fCountry" placeholder="🌍 بلد الإقامة *" value="تونس" style="width:100%;padding:11px;margin-bottom:8px;border:2px solid #475569;border-radius:20px;background:#0f172a;color:white;font-size:13px;box-sizing:border-box">
    <input id="fCity" placeholder="🏙️ المدينة *" style="width:100%;padding:11px;margin-bottom:8px;border:2px solid #475569;border-radius:20px;background:#0f172a;color:white;font-size:13px;box-sizing:border-box">
    <div id="cats" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:12px"></div>
    <button id="submit" style="width:100%;padding:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;border:3px solid #fbbf24;border-radius:40px;font-weight:900;font-size:14px;cursor:pointer;margin-bottom:8px">✅ ادخل وتصفح مجاناً</button>
    <button id="exit" style="width:100%;padding:10px;background:#dc2626;color:white;border:2px solid #fbbf24;border-radius:40px;font-weight:900;font-size:12px;cursor:pointer;margin-bottom:8px">🚪 أرفض — غادر</button>
    <div style="text-align:center;padding-top:8px;border-top:1px dashed #475569">
      <button id="adminBtn" style="background:none;border:none;color:#94a3b8;font-size:11px;cursor:pointer;text-decoration:underline">👑 دخول المشرف</button>
    </div>
  </div>
</div>

<!-- 🏠 الصفحة الرئيسية -->
<div style="max-width:800px;margin:40px auto;text-align:center;padding:20px">
  <div style="font-size:100px;margin-bottom:15px">🎓</div>
  <h1 style="color:#fbbf24;font-size:26px;font-weight:900">منصة زايد</h1>
  <p style="color:#cbd5e1;font-size:14px;margin-top:10px">النسخة الجديدة — نظيفة وسريعة</p>
  <p style="color:#4ade80;font-size:13px;margin-top:20px">✅ إذا كنت ترى هذه الصفحة، فأنت مسجل</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyA8LK52iXBPZFbqHnXyaAsldgqcjz7Bj4o",
  authDomain: "zaied-plateform.firebaseapp.com",
  projectId: "zaied-plateform",
  storageBucket: "zaied-plateform.firebasestorage.app",
  messagingSenderId: "703013673948",
  appId: "1:703013673948:web:585875a9a69312cfe48d19"
});
const db = getFirestore(app);

window.sendWhatsApp = async function(msg) {
  try {
    const response = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        access_key: '23f532ab-bd1b-4362-b980-2bab75c5b48b',
        subject: '🎓 إشعار من منصة زايد',
        from_name: 'منصة زايد',
        email: 'zeidoun2021@gmail.com',
        message: msg
      })
    });
    const data = await response.json();
    console.log('📧 بريد مرسل:', data.success);
    return true;
  } catch(e) {
    console.error('📧 خطأ:', e);
    return false;
  }
};});
  } catch(e){}
};
window.fbSaveUser = async function(u) {
  try { const r = await addDoc(collection(db,"users"), {...u, createdAt:serverTimestamp()}); return r.id; } catch(e){ return null; }
};
window.fbSaveVisitor = async function(v) {
  try { await addDoc(collection(db,"visitors"), {...v, visitedAt:serverTimestamp()}); return true; } catch(e){ return false; }
};
window.fbGetAllUsers = async function() {
  try { const s = await getDocs(collection(db,"users")); const a=[]; s.forEach(d=>a.push({firebaseId:d.id,...d.data()})); return a; } catch(e){ return []; }
};
window.fbGetAllVisitors = async function() {
  try { const s = await getDocs(collection(db,"visitors")); const a=[]; s.forEach(d=>a.push({firebaseId:d.id,...d.data()})); return a; } catch(e){ return []; }
};
console.log('✅ Firebase ready');
</script>

<script>
(function() {
  var isAdmin = location.search.indexOf('admin=1') !== -1 || localStorage.getItem('zaiedAdminPermanent') === '1';
  var isVisitorOK = localStorage.getItem('zaiedVisitorOK') === '1';

  if (isAdmin) {
    document.body.classList.add('admin-mode');
    document.getElementById('statsBtn').style.display = 'block';
    var g = document.getElementById('gate'); if (g) g.style.display = 'none';
  } else if (!isVisitorOK) {
    setTimeout(function(){ document.getElementById('gate').style.display = 'flex'; }, 500);
  }

  // الفئات
  var cats = [['طفل','🧒'],['ولي','👨‍👩‍👧'],['طالب','🎓'],['أستاذ','👨‍🏫'],['باحث','🔬'],['خبير','🧠']];
  var catDiv = document.getElementById('cats');
  cats.forEach(function(c) {
    var l = document.createElement('label');
    l.style.cssText = 'background:rgba(255,255,255,0.1);padding:6px 10px;border-radius:15px;cursor:pointer;font-size:11px;font-weight:700;border:2px solid transparent';
    l.innerHTML = '<input type="radio" name="cat" value="'+c[0]+'" style="display:none">'+c[1]+' '+c[0];
    l.onclick = function() {
      catDiv.querySelectorAll('label').forEach(function(x){x.style.background='rgba(255,255,255,0.1)';x.style.borderColor='transparent';x.style.color='white'});
      l.style.background='#fbbf24'; l.style.color='#0f172a'; l.style.borderColor='#fbbf24';
      l.querySelector('input').checked = true;
    };
    catDiv.appendChild(l);
  });

  // تسجيل
  document.getElementById('submit').onclick = async function() {
    var name = document.getElementById('fName').value.trim();
    var prof = document.getElementById('fProf').value.trim();
    var spec = document.getElementById('fSpec').value.trim();
    var email = document.getElementById('fEmail').value.trim().toLowerCase();
    var phone = document.getElementById('fPhone').value.trim();
    var country = document.getElementById('fCountry').value.trim();
    var city = document.getElementById('fCity').value.trim();
    var cat = (document.querySelector('input[name="cat"]:checked')||{}).value || '';
    var e = document.getElementById('err');
    var errs = [];
    if (!name || name.length < 3) errs.push('الاسم');
    if (!prof) errs.push('المهنة');
    if (!spec) errs.push('الاختصاص');
    if (!email || email.indexOf('@') === -1) errs.push('البريد');
    if (!phone || phone.length < 8) errs.push('الهاتف');
    if (!city) errs.push('المدينة');
    if (!cat) errs.push('الفئة');
    if (errs.length) { e.style.display='block'; e.textContent='⚠️ '+errs.join(' • '); return; }
    e.style.display = 'none';
    this.textContent = '⏳ جاري...';
    this.disabled = true;
    try {
      var ua = navigator.userAgent;
      var device = /Mobile|Android|iPhone/i.test(ua) ? 'هاتف' : 'حاسوب';
      var browser = /Chrome/i.test(ua) ? 'Chrome' : /Firefox/i.test(ua) ? 'Firefox' : 'آخر';
      var u = {name,profession:prof,specialty:spec,email,whatsapp:phone,country,city,category:cat,date:new Date().toLocaleString('ar-EG')};
      if (window.fbSaveUser) await window.fbSaveUser(u);
      if (window.fbSaveVisitor) await window.fbSaveVisitor({name,phone,email,country,city,device,browser});
      if (window.sendWhatsApp) await window.sendWhatsApp('🎓 تسجيل جديد\n👤 '+name+'\n💼 '+prof+'\n🎯 '+spec+'\n📧 '+email+'\n📱 '+phone+'\n🌍 '+country+'\n🏙️ '+city+'\n🏷️ '+cat);
      localStorage.setItem('zaiedVisitorOK','1');
      alert('✅ مرحباً '+name+'!');
      location.reload();
    } catch(err) {
      e.style.display='block'; e.textContent='⚠️ خطأ: '+err.message;
      this.textContent='✅ ادخل وتصفح'; this.disabled = false;
    }
  };

  document.getElementById('exit').onclick = function() {
    if (!confirm('🚪 مغادرة؟')) return;
    if (window.sendWhatsApp) window.sendWhatsApp('🚪 زائر رفض التسجيل');
    document.body.innerHTML = '<div style="min-height:100vh;background:#0f172a;color:white;display:flex;align-items:center;justify-content:center;text-align:center"><div><div style="font-size:100px">👋</div><h1 style="color:#fbbf24;margin:20px 0">إلى اللقاء!</h1></div></div>';
  };

  document.getElementById('adminBtn').onclick = function() {
    var p = prompt('👑 كلمة المرور:');
    if (p === '012345') {
      localStorage.setItem('zaiedAdminPermanent','1');
      localStorage.setItem('zaiedVisitorOK','1');
      location.href = location.pathname + '?admin=1';
    }
  };

  // لوحة الإحصائيات
  window.sdLoad = async function() {
    var users = await window.fbGetAllUsers();
    var visitors = await window.fbGetAllVisitors();
    document.getElementById('nU').textContent = users.length;
    document.getElementById('nV').textContent = visitors.length;
    document.getElementById('nS').textContent = users.filter(function(u){return u.subscribed}).length;
    document.getElementById('nT').textContent = users.filter(function(u){
      if (!u.createdAt || !u.createdAt.seconds) return false;
      return new Date(u.createdAt.seconds*1000).toDateString() === new Date().toDateString();
    }).length;
    window._u = users;
    window._v = visitors;
    renderUsers();
  };

  window.renderUsers = function() {
    var q = (document.getElementById('q').value || '').toLowerCase();
    var users = (window._u || []).filter(function(u){
      if (!q) return true;
      return ((u.name||'')+(u.email||'')+(u.whatsapp||'')+(u.profession||'')).toLowerCase().indexOf(q) !== -1;
    });
    document.getElementById('list').innerHTML = users.slice(0,30).map(function(u,i){
      return '<div class="sd-user"><div class="u-name" style="font-weight:900;color:#dc2626">'+(i+1)+'. '+(u.name||'-')+'</div><div style="color:#475569">📧 '+(u.email||'-')+' • 📱 '+(u.whatsapp||'-')+'</div><div style="color:#475569">💼 '+(u.profession||'-')+' • 🎯 '+(u.specialty||'-')+'</div><div style="color:#475569">🌍 '+(u.country||'-')+' • 🏙️ '+(u.city||'-')+'</div></div>';
    }).join('');
  };

  window.exportUsers = function() {
    if (!window._u) return;
    var csv = 'الاسم,المهنة,الاختصاص,البريد,الهاتف,البلد,المدينة,الفئة\n';
    window._u.forEach(function(u){ csv += '"'+(u.name||'')+'","'+(u.profession||'')+'","'+(u.specialty||'')+'","'+(u.email||'')+'","'+(u.whatsapp||'')+'","'+(u.country||'')+'","'+(u.city||'')+'","'+(u.category||'')+'"\n'; });
    var b = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    var a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download='المسجلون.csv'; a.click();
  };

  window.exportVisitors = function() {
    if (!window._v) return;
    var csv = 'الاسم,الهاتف,البلد,المدينة\n';
    window._v.forEach(function(v){ csv += '"'+(v.name||'')+'","'+(v.phone||'')+'","'+(v.country||'')+'","'+(v.city||'')+'"\n'; });
    var b = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    var a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download='الزوار.csv'; a.click();
  };

  console.log('✅ النظام جاهز');
})();
</script>
</body>
</html>
